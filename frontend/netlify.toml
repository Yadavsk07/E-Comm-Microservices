[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api requests to DuckDNS API Gateway (completely bypasses browser CORS)
[[redirects]]
  from = "/api/*"
  to = "https://ecomm-microservices-api.duckdns.org/api/:splat"
  status = 200
  force = true

# Client-side routing fallback for React Router SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
