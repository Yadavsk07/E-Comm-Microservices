spring.application.name=api-gateway

server.port=${PORT:8080}


# Eureka
eureka.client.service-url.defaultZone=${eureka_server_url}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

# =========================================================
# Gateway Routes
# =========================================================

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service

spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE

spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# ========================================
# User Service
# ========================================

spring.cloud.gateway.server.webmvc.routes[1].id=user-service

spring.cloud.gateway.server.webmvc.routes[1].uri=lb://AUTH-SERVICE

spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users/**

# ========================================
# Product Service
# ========================================

spring.cloud.gateway.server.webmvc.routes[2].id=product-service

spring.cloud.gateway.server.webmvc.routes[2].uri=lb://PRODUCT-SERVICE

spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/products/**

# ========================================
# Cart Service
# ========================================

spring.cloud.gateway.server.webmvc.routes[3].id=cart-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://CART-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/cart/**

# ========================================
# Order Service
# ========================================

spring.cloud.gateway.server.webmvc.routes[4].id=order-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/orders/**


# ========================================
# Payment Service
# ========================================

spring.cloud.gateway.server.webmvc.routes[5].id=payment-service

spring.cloud.gateway.server.webmvc.routes[5].uri=lb://PAYMENT-SERVICE

spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/payments/**

## Gateway discovery locator
#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true



frontend.url=${frontend.url}

spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedOrigins[0]=${frontend.url}
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedHeaders[0]=Authorization
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedHeaders[1]=Content-Type
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowedHeaders[2]=Accept
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowCredentials=true

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always